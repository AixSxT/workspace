<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>客户提问 - 智能答疑</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .chat-shell {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 18px;
      align-items: start;
    }
    .chat-window {
      height: 70vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      background: linear-gradient(145deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    }
    .messages {
      flex: 1;
      overflow: auto;
      padding-right: 4px;
    }
    .bubble {
      max-width: 80%;
      padding: 12px 14px;
      border-radius: 16px;
      margin-bottom: 12px;
      line-height: 1.6;
      box-shadow: 0 10px 24px rgba(5, 12, 28, 0.35);
    }
    .bubble.me {
      margin-left: auto;
      background: linear-gradient(135deg, #3b82f6, #5aa8ff);
      color: #f8fbff;
    }
    .bubble.ai {
      margin-right: auto;
      background: #0c1426;
      border: 1px solid var(--border);
    }
    .input-row {
      display: flex;
      gap: 10px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .input-row textarea {
      height: 48px;
      resize: none;
    }
    .drawer {
      padding: 18px;
      background: linear-gradient(165deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }
    .status-pill.blue { background: rgba(90,168,255,0.14); color: #cfe4ff; }
    .status-pill.yellow { background: rgba(251,191,36,0.18); color: #fbbf24; }
    .status-pill.green { background: rgba(52,211,153,0.18); color: #34d399; }
    .tag.blue { background: rgba(90,168,255,0.14); color: #cfe4ff; }
    .tag.yellow { background: rgba(251,191,36,0.18); color: #fbbf24; }
    .tag.green { background: rgba(52,211,153,0.18); color: #34d399; }
    .ticket-item {
      padding: 12px 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 10px;
      background: #0c1426;
      cursor: pointer;
      transition: border 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    }
    .ticket-item:hover {
      border-color: #2f80ed;
      box-shadow: 0 14px 30px rgba(6, 13, 28, 0.4);
      transform: translateY(-1px);
    }
    .red-dot {
      width: 10px;
      height: 10px;
      background: #ef4444;
      border-radius: 50%;
      display: inline-block;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(90,168,255,0.12);
      color: #cfe4ff;
      font-weight: 600;
      font-size: 12px;
    }
    .system-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      background: #0c1426;
      margin-top: 10px;
    }
    .hidden {
      display: none !important;
    }
    .btn-icon {
      width: 48px;
      min-width: 48px;
      height: 48px;
      padding: 0;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    #myTicketsBtn {
      position: relative;
    }
    #myTicketsDot {
      position: absolute;
      top: 4px;
      right: 6px;
      width: 10px;
      height: 10px;
      background: #ef4444;
      border-radius: 50%;
      display: none;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
    }
    @media (max-width: 960px) {
      .chat-shell {
        grid-template-columns: 1fr;
      }
      .chat-window {
        height: 70vh;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="flex glass" style="padding:16px 20px; align-items:center; gap:16px;">
      <div class="brand">
        <div class="dot" style="background:linear-gradient(135deg,#3b82f6,#5aa8ff);"></div>
        <div>人康工具答疑</div>
      </div>
      <div class="tag">客户端</div>
      <div class="spacer"></div>
      <button id="newTicketBtn" class="btn ghost">新建问题</button>
      <button id="myTicketsBtn" class="btn ghost" style="position:relative;">我的问题<span id="myTicketsDot"></span></button>
    </div>

    <div class="chat-shell" style="margin-top:18px; align-items:stretch;">
      <div class="glass chat-window" style="height:70vh;">
        <div class="messages no-scrollbar" id="messages"></div>
        <div class="input-row">
          <textarea id="userInput" class="input" placeholder="请输入问题，例：我的APP看不了直播，帮我看看"></textarea>
          <button id="sendBtn" class="btn btn-icon" aria-label="发送">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M3.5 12L4.9 7.1C5.3 5.8 5.5 5.2 5.9 4.8C6.3 4.4 6.8 4.2 8.1 3.8L18.8 0.6C20.7 0 21.7 -0.2 22.3 0.3C22.9 0.8 22.8 1.8 22.6 3.7L21.4 16.3C21.2 18.3 21.1 19.3 20.5 19.9C19.9 20.5 18.9 20.4 16.9 20.2L8 19.3C7.3 19.2 6.9 19.1 6.6 18.9C6.3 18.7 6.1 18.4 6 18L4 12.6C3.8 12.2 3.7 12 3.7 12C3.7 12 3.6 11.8 3.5 11.4V12Z" fill="url(#g1)" />
              <path d="M5 12L10.5 12" stroke="white" stroke-width="1.6" stroke-linecap="round" />
              <path d="M12 7L16 11L12 15" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
              <defs>
                <linearGradient id="g1" x1="4" y1="2" x2="18" y2="20" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#5aa8ff"/>
                  <stop offset="1" stop-color="#3b82f6"/>
                </linearGradient>
              </defs>
            </svg>
          </button>
        </div>
      </div>

      <div class="glass drawer hidden" id="drawerPanel" style="height:70vh;">
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:12px;">
          <div style="font-weight:700;">工单进度</div>
          <div class="tag" id="statusTag">待提问</div>
        </div>
        <div id="ticketSummary" class="pill" style="min-height:120px; font-size:14px; line-height:1.6;">
          暂无工单，请先提交问题。
        </div>
        <div class="divider"></div>
        <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px;">
          <div style="font-weight:700;">我的问题</div>
          <select id="statusFilter" class="pill" style="padding:8px 10px; background:#0c1426; color:var(--primary); border-color:var(--border);">
            <option value="all">全部</option>
            <option value="collecting">待确认问题</option>
            <option value="pending_cs">待客服处理</option>
            <option value="done">已完成</option>
          </select>
        </div>
        <div id="ticketList" class="no-scrollbar" style="overflow:auto; flex:1; min-height:0;">
        </div>
      </div>
    </div>
  </div>

  <script src="/customer.js"></script>
</body>
</html>
